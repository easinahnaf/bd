name: Unzip Media Hub ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.zip'

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP file
        id: findzip
        shell: bash
        run: |
          echo "Searching for ZIP file..."

          ZIP=$(find . \
            -type f \
            -iname "*.zip" \
            -not -path "./.git/*" \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found!"
            echo "zip_not_found=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "Found ZIP: $ZIP"
          echo "zip_path=$ZIP" >> "$GITHUB_OUTPUT"
          echo "zip_not_found=false" >> "$GITHUB_OUTPUT"

      - name: Create output directory
        run: |
          rm -rf unzipped-media
          mkdir -p unzipped-media

      - name: Unzip ZIP file
        if: steps.findzip.outputs.zip_not_found == 'false'
        shell: bash
        run: |
          ZIP="${{ steps.findzip.outputs.zip_path }}"

          echo "Unzipping: $ZIP"

          unzip -o "$ZIP" -d unzipped-media

          echo "Unzip completed successfully."

      - name: Show extracted files
        if: steps.findzip.outputs.zip_not_found == 'false'
        run: |
          echo "Extracted files:"
          find unzipped-media -maxdepth 3 -type f | head -200

      - name: Upload unzipped files
        if: steps.findzip.outputs.zip_not_found == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: unzipped-media
          path: unzipped-media/
          if-no-files-found: error
